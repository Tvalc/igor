feature_notes:
  multi_direction: Reference sheet gives front, side and back views, not 8 directions
  export_project: Exporting off-platform requires a paid plan
  edit_code: "Code Studio has a tabbed file editor, Git source control and GitHub sync"
  tilesets: "Tilesets preset group (e.g. Ground Tileset) in image generation, tuned to repeat without seams"
  text_to_motion: "Describe a movement to generate a 2D sprite animation, not 3D motion data"
  mobile: "Dashboard, projects and game editor work on phones; games play in the browser"
  custom_training: "No model training; Collections steer style from your own uploaded or generated reference art"
