name: Bezi
url: https://www.bezi.com
tagline: AI agent inside Unity with change review and restore.
description: Bezi is an AI agent that works inside the Unity Editor, with change review and restore points so you
  can undo its edits.
best_for: Unity devs who want an agent with safety rails.
categories:
- code
tags:
- agent
- unity
status: active
