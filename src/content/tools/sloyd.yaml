name: Sloyd
url: https://www.sloyd.ai
tagline: Parametric 3D props you can tweak with sliders.
description: "Sloyd generates game-ready 3D props from parametric templates you adjust, plus text- and image-to-3D. It can also auto-rig humanoid characters and animate them from presets, text prompts or video."
best_for: Clean, game-ready props with predictable topology.
