feature_notes:
  no_code: "Describe the change in chat and the agent writes the GDScript and scenes"
  edit_code: "Projects are plain Godot 4 projects (GDScript or C#) you can open in Godot, VS Code, Cursor, Rider or Zed"
  ai_art: "Agent models 3D props and characters in a bundled Blender; placeholder models via Tripo need your own key"
  ai_audio: "Placeholder looping music built in; sound and voice need your own ElevenLabs key"
  multiplayer: "Test rooms work only inside Flockbay; Steam multiplayer for a shipped game is added on request"
  hosting: "Playtest links (paid plans) open in the Flockbay Playtest app, not the browser; marketing sites on flockbay.app"
  export_project: "Your game is a normal Godot project folder on your own disk"
  engine_integration: "Runs the official Godot editor, not a fork, with the agent built in"
  mcp: "flockbay mcp connects Claude Code, Codex, Cursor, Gemini CLI, Cline or any MCP client"
  scene_editing: "Agent writes scenes and places props, not just scripts"
  runs_game: "Runs headless tests, sends input, captures the viewport and reads the live scene tree and profiler"
  model_choice: "Free Demo model, hosted Claude, GPT and Gemini models on paid plans, your own Claude Code or ChatGPT plan, or API keys"
