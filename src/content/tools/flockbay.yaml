name: Flockbay
url: https://flockbay.com
tagline: Free desktop AI game maker that runs the official Godot editor with an agent built in.
description: "Flockbay is a free desktop app for Windows, macOS and Linux that runs the official Godot 4 editor
  with an AI agent and MCP server built in. The agent writes GDScript and scenes, playtests the game and fixes
  errors, models props in a bundled Blender, and helps market the game with trailers, Shorts and a Steam page draft.
  Projects stay normal Godot projects on your own disk. Made by 9560-9970 Québec inc. in Montréal."
best_for: Godot developers who want an AI agent inside the real Godot editor, free or with their own Claude or ChatGPT.
