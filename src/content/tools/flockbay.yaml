  free_tier: 'yes'
  starting_price_usd: 20
  notes: "Free plan has a daily hosted AI allowance (Demo model) plus unlimited use of your own Claude, ChatGPT,
    agent or API key. Paid: Hobby $20, Indie Developer $60, Studio $200 a month."
license:
  commercial_use: 'yes'
  open_source: false
  notes: "You keep ownership of your content and Flockbay takes no share of a game's sales. The Terms make you
    responsible for clearing the licenses of AI outputs and assets before commercial use."
