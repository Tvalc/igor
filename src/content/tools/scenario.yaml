name: Scenario
url: https://www.scenario.com
tagline: Train models on your game's art style and generate on-style assets.
description: Scenario lets teams train custom models on their own art style and generate consistent game assets.
  It's aimed at studios.
best_for: Teams that need many assets in one consistent style.
categories:
- art-2d
- art-3d
tags:
- style-training
- sprites
- 2d
status: active
platforms:
- web
- api
engines:
- blender
exports:
- png
- glb
- obj
- fbx
- pbr-maps
skill_level: intermediate
pricing:
  model: freemium
  free_tier: 'yes'
  starting_price_usd: 15
  notes: Free plan 50 daily credits; Starter $15/mo (1,500 credits), Pro $45/mo (5,000), Max $75/mo (10,000); annual
    33% cheaper.
license:
  commercial_use: paid-plans
  open_source: false
  notes: 'Paid plans: full commercial license, and you own generated assets. Free plan: personal/evaluation use
    only.'
sources:
