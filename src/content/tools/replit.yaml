feature_notes:
  ai_art: Image Generation toggle in Agent Tools (e.g. game sprites)
  export_project: Download as zip or sync to GitHub
  mcp: Agent connects to remote MCP servers (since Dec 2025)
  model_choice: Manual model pick only on Core/Pro in Power/Max modes; Free uses Auto
  ai_audio: "Agent generates music, sound effects and voice-overs (powered by ElevenLabs)"
  multiplayer: "Replit's game guide suggests adding multiplayer with a follow-up Agent prompt"
  scene_editing: "Visual Editor tweaks UI elements and swaps images in the preview; no game scene editor"
  local_models: "Agent runs on Replit's cloud models; you can't swap in a local model"
plans:
- name: Starter
  price_usd: 0
  period: free
  includes: Daily Agent allowance, 1 published app
- name: Core
  price_usd: 20
  period: month
  includes: $20 credits/mo, 5 collaborators ($18/mo yearly)
- name: Pro
  price_usd: 100
  period: month
  includes: Tiered credits, 15 builders, 10 parallel tasks ($90 yearly)
