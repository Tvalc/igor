name: Replit
url: https://replit.com
tagline: General AI app builder often used to make web games.
description: Replit's AI agent builds and deploys web apps from prompts. It isn't game-specific, but it's often
  used for browser games.
best_for: Building a web game from a prompt with code you can inspect.
categories:
- game-maker
- code
tags:
- browser
- general-purpose
- agent
status: active
platforms:
- web
engines: []
exports:
- web
- source-code
skill_level: intermediate
pricing:
  model: freemium
  free_tier: 'yes'
  starting_price_usd: 20
  notes: Starter free (daily Agent credits, 1 published app); Core $20/mo ($18/mo billed annually); Pro $100/mo
    ($90/mo annually).
license:
  commercial_use: 'yes'
  open_source: false
sources:
- https://replit.com
- https://replit.com/blog/pro-plan
- https://replit.com/pricing
- https://docs.replit.com/build/your-first-app
- https://docs.replit.com/build/mobile-first-app
- https://docs.replit.com/platforms/mobile-app
- https://docs.replit.com/help/pricing-and-plans.md
- https://docs.replit.com/help/pricing-and-plans
- https://docs.replit.com/help/projects-and-files
- https://blog.replit.com/image-generation
- https://docs.replit.com/features/agent/model-selector
- https://docs.replit.com/build/connect-via-mcp
- https://docs.replit.com/features/agent/overview
needs_verification: []
last_verified: '2026-10-21'
features:
  hosting: 'yes'
  mobile: 'yes'
  runs_game: 'yes'
  no_code: 'yes'
  edit_code: 'yes'
  ai_art: 'yes'
  export_project: 'yes'
  mcp: 'yes'
  model_choice: partial
feature_notes:
  ai_art: Image Generation toggle in Agent Tools (e.g. game sprites)
  export_project: Download as zip or sync to GitHub
  mcp: Agent connects to remote MCP servers (since Dec 2025)
  model_choice: Manual model pick only on Core/Pro in Power/Max modes; Free uses Auto
plans:
- name: Starter
  price_usd: 0
  period: free
  includes: Daily Agent allowance, 1 published app
- name: Core
  price_usd: 20
  period: month
  includes: $20 credits/mo, 5 collaborators ($18/mo yearly)
- name: Pro
  price_usd: 100
  period: month
  includes: Tiered credits, 15 builders, 10 parallel tasks ($90 yearly)
