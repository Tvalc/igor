- pbr-maps
- wav
skill_level: intermediate
pricing:
  model: paid
  free_tier: trial
  starting_price_usd: 10
  notes: 'Personal: 14-day trial (1,000 credits) then $10/mo for 1,000 credits/mo; Pro includes 2,000 credits/mo;
    MCP server and AI Gateway don''t use credits'
license:
  commercial_use: 'no'
  open_source: false
  notes: 'Open beta under Evaluation Version terms: non-commercial/testing only until GA. Users own inputs/outputs.'
