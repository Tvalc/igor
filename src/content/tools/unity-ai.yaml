name: Unity AI
url: "https://unity.com/features/ai"
tagline: "Unity's in-editor AI assistant, AI gateway, CLI with built-in MCP mode, and official agent plugin."
description: "Unity's AI tools (branded Unity AI until recently, and the successor to Unity Muse) bundle an in-editor agentic assistant with asset generators, an AI gateway for third-party agents, the Unity CLI with a built-in MCP mode, and an official plugin for Claude Code, Codex and Grok. The older in-package Unity MCP server is deprecated in favour of the CLI. The assistant is in beta: included with Pro and Enterprise, or $10 a month on Personal after a free trial. The CLI, MCP server and plugin are free."
best_for: Unity developers who want first-party AI inside the editor.
