name: Unity AI
url: https://unity.com/ai
tagline: Unity's built-in Assistant, Generators, AI Gateway and official MCP server.
description: Unity AI replaced Unity Muse. It bundles an in-editor Assistant, asset Generators, an AI Gateway and
  an official MCP server. It entered open beta in May 2026 at $10/month on Unity Personal and is included with Pro.
best_for: Unity developers who want first-party AI inside the editor.
categories:
- code
- art-2d
- game-maker
