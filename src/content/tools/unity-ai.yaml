  mcp: 'yes'
  scene_editing: 'yes'
  model_choice: 'yes'
  ai_art: 'yes'
  ai_audio: 'yes'
  sprite_sheets: 'yes'
  transparent_bg: 'yes'
  pixel_art: partial
  runs_game: partial
  edit_code: 'yes'
  api: partial
  mobile: 'yes'
  multiplayer: 'yes'
feature_notes:
  scene_editing: Agent mode creates, modifies or removes objects and assets with approval
  model_choice: AI Gateway connects third-party models; Unity MCP connects agents like Claude Code, Cursor
  sprite_sheets: Spritesheet tab makes 4x4 (16-frame) sheets
  transparent_bg: Remove BG tab in Sprite Generator
  pixel_art: Pixelate post-processing option only
  runs_game: "Through Unity's beta CLI and MCP server, AI agents can enter Play mode and run tests"
  edit_code: "Agent mode writes C# scripts into your project, which you can open and edit"
  api: "C# AssistantApi lets your own editor scripts run the assistant; no public web API"
  mobile: "Games are built in the Unity engine, which exports to iOS and Android"
  multiplayer: "Built in Unity, which has Netcode and Multiplayer Services for online games"
plans:
- name: Personal
  price_usd: 0
  period: free
  includes: 14-day AI trial with 1,000 credits
- name: Pro
  price_usd: 210
  period: month
  includes: Unity Pro seat; 2,000 AI credits/mo
- name: Enterprise
  price_usd: null
  period: custom
  includes: 3,000 AI credits/mo
