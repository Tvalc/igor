name: Amplify
url: https://amplify.is
tagline: Describe a browser game in plain words, refine it by chat and publish it on its own link.
description: "Amplify is a web-based AI builder from Iceland that turns a plain-English description into a playable
  browser game (it also builds websites and web apps). You change the game by chatting and publish it for free on
  its own address or your own domain. A remote MCP server lets AI assistants build and edit projects. Built by solo
  founder Gudmundur Kristjansson; not related to AWS Amplify."
best_for: Beginners who want a small browser game from a prompt with no install and pay-as-you-go credits.
