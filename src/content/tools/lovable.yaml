name: Lovable
url: https://lovable.dev
tagline: General AI app builder that can produce simple web games.
description: Lovable builds web apps from chat prompts. It isn't game-specific, but simple web games are within
  reach.
best_for: Simple web games alongside other app ideas.
categories:
- game-maker
- code
tags:
- browser
- general-purpose
- agent
- genre-puzzle
status: active
platforms:
- web
engines: []
exports:
- web
- source-code
skill_level: intermediate
pricing:
  model: freemium
  free_tier: 'yes'
  starting_price_usd: 25
  notes: Pro $25/mo (100 credits/mo + 5 daily); Business $50/mo; Free 5 daily credits (up to 30/mo)
license:
  commercial_use: 'yes'
  open_source: false
  notes: Users own apps, code and content and can use them commercially, subject to third-party/open-source rights
affiliate:
