- https://github.blog/changelog/2025-04-03-github-copilot-in-vs-code-march-release-v1-99
- https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/changing-the-ai-model
- https://github.blog/changelog/2026-10-07-discover-local-models-in-github-copilot-cli
- https://docs.github.com/en/enterprise-cloud@latest/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode
- https://github.blog/changelog/2025-07-16-agent-mode-for-jetbrains-eclipse-and-xcode-is-now-generally-available/
