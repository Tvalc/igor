name: GitHub Copilot
url: https://github.com/features/copilot
tagline: GitHub's AI coding assistant and agent.
description: GitHub Copilot offers code completion, chat and an agent mode in popular editors, including Visual
  Studio and Rider used for Unity and Unreal.
best_for: Developers already in VS Code, Visual Studio or Rider.
categories:
- code
tags:
- general-purpose
- agent
status: active
platforms:
- plugin
engines: []
exports:
- source-code
skill_level: intermediate
pricing:
  model: freemium
  free_tier: 'yes'
  starting_price_usd: 10
  notes: Free (2,000 completions/mo plus limited AI credits); Pro $10/mo; Pro+ $39/mo; Max $100/mo
license:
  commercial_use: 'yes'
  open_source: false
sources:
- https://github.com/features/copilot
- https://github.com/features/copilot/plans
- https://docs.github.com/en/copilot/get-started/plans
- https://docs.github.com/en/copilot/concepts/billing/individual-plans
