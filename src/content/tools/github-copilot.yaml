needs_verification: []
last_verified: '2026-10-21'
features:
  mcp: 'yes'
  model_choice: 'yes'
  local_models: partial
  runs_game: partial
plans:
- name: Free
  price_usd: 0
  period: free
  includes: Up to 2,000 completions/mo, limited AI credits, auto model only
- name: Pro
  price_usd: 10
  period: month
  includes: 1,500 AI credits/mo (1,000 base + 500 flex)
- name: Pro+
  price_usd: 39
  period: month
  includes: 7,000 AI credits/mo (3,900 base + 3,100 flex)
- name: Max
  price_usd: 100
  period: month
  includes: 20,000 AI credits/mo; upgrade for existing Copilot users
feature_notes:
  runs_game: "Cloud agent can run web apps in a built-in browser and screenshot them; not game engines"
