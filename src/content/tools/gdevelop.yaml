name: GDevelop
url: https://gdevelop.io
tagline: Open-source no-code engine with an AI agent and store exports.
description: GDevelop is an open-source, event-based game engine with an AI agent that can build and edit games.
  It exports to web, desktop and mobile stores.
best_for: Beginners who want an AI helper and real export targets.
categories:
- game-maker
tags:
