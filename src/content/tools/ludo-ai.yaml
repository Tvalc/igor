- png
- sprite-sheet
- gif
- glb
- obj
skill_level: intermediate
pricing:
  model: trial
  free_tier: trial
  starting_price_usd: 20
  notes: Indie $20/mo ($15 yearly, 250 credits/mo); Pro $50/mo ($35 yearly, 1,000 credits/mo); free trial 30 credits
license:
  commercial_use: 'yes'
  open_source: false
