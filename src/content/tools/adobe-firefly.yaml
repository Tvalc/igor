name: Adobe Firefly
url: https://firefly.adobe.com
tagline: Adobe's image, audio and video generation models.
description: Adobe Firefly generates images, audio and video. Adobe positions its models as trained on licensed
  content, which matters to studios worried about IP.
best_for: Teams that need commercially cautious image generation.
categories:
- art-2d
- sfx
tags:
- concept-art
- 2d
- general-purpose
status: active
platforms:
- web
- desktop
engines: []
exports:
- png
skill_level: beginner
pricing:
  model: freemium
  free_tier: limited
  starting_price_usd: 9.99
  notes: Firefly Standard US$9.99/mo (2,000 premium credits/mo, unlimited standard generations); Pro, Pro Plus,
    Premium tiers above. Free tier has limited daily generations.
license:
  commercial_use: 'yes'
  open_source: false
  notes: Commercial use allowed for non-beta Firefly features; outputs from third-party partner models fall under
    those models' own terms.
affiliate:
  program: Adobe affiliate program
sources:
- https://firefly.adobe.com
- https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html
- https://blog.adobe.com/en/publish/2025/10/28/explore-new-adobe-firefly-your-all-in-one-home-ai-powered-creativity
- https://helpx.adobe.com/firefly/web/get-started/learn-the-basics/adobe-firefly-faq.html
- https://www.adobe.com/products/firefly/plans.html
- https://www.adobe.com/cc-shared/fragments/products/firefly/plans/faq
- https://helpx.adobe.com/firefly/web/work-with-enterprise-features/train-custom-models/manage-custom-models.html
- https://helpx.adobe.com/hk_en/firefly/web/custom-models.html
- https://www.adobe.com/products/firefly/features/custom-models
- https://helpx.adobe.com/firefly/using/customize-a-firefly-model.html
- https://helpx.adobe.com/firefly/work-with-audio-and-video/work-with-audio/text-to-sound-effects.html
- https://developer.adobe.com/firefly-services/docs/firefly-api/guides
needs_verification: []
last_verified: '2026-10-21'
features:
  custom_training: partial
  text_to_sfx: 'yes'
  consistent_characters: partial
  variations: 'yes'
  api: 'yes'
feature_notes:
  consistent_characters: Via Firefly Custom Models (character/style training); public beta for CC, full access on
    enterprise plans
  variations: Generate Sound Effects returns 4 variations per generation, up to 30s each
  api: Firefly Services API (image generation) via Adobe Developer Console credentials
plans:
- name: Free
  price_usd: 0
  period: free
  includes: Limited daily generations
- name: Standard
  price_usd: 9.99
  period: month
  includes: 2,000 generative credits/mo, unlimited standard generations
- name: Pro
  price_usd: 19.99
  period: month
  includes: 4,000 generative credits/mo
- name: Pro Plus
  price_usd: 49.99
  period: month
  includes: 10,000 generative credits/mo
- name: Premium
  price_usd: 199.99
  period: month
  includes: 50,000 generative credits/mo
