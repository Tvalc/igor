feature_notes:
  export_project: Code download and Windows export on Pro plan and higher
  ai_audio: "Sound effects and music tracks generated in the editor, paid with credits"
  multiplayer: "Built-in real-time multiplayer with a multiplayer starter template"
  mobile: "Games play in a phone's web browser from the share link, no install"
  pixel_art: "Pixel art via prompt in the 2D generator; the sprite sheet generator outputs pixel-art animations"
  sprite_sheets: "Idle, walk, attack, jump or custom motion; transparent PNG sheet plus JSON frame timing"
  transparent_bg: "Sprites, icons, UI and portraits come back with the background removed"
  multi_direction: "Choose from 8 facings in top-down, isometric or side view; one facing per generation"
  tilesets: "Generates individual floor, wall and terrain tiles to build a tileset, not a full tileset sheet"
