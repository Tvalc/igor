name: PixelLab
url: https://www.pixellab.ai
tagline: Pixel-art sprites, skeleton animation, 4/8-direction rotations and tilesets.
description: PixelLab generates pixel-art characters and objects, animates them with skeletons, rotates them into
  4 or 8 directions, and builds tilesets.
best_for: Pixel-art games that need consistent multi-direction sprites.
