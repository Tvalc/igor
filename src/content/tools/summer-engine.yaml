feature_notes:
  model_choice: Via external MCP clients (Claude Code, Cursor, Codex)
  ai_art: Cloud generation of images and 3D models uses credits
  ai_audio: Cloud generation uses credits
  mobile: Export targets include mobile
  no_code: "Describe a game in plain language and the AI builds a playable project"
  edit_code: "Projects use standard Godot 4 scripts and scenes you can edit directly"
  multiplayer: "Summer SDK handles multiplayer servers for you"
  export_project: "Project files live on your machine as a normal Godot 4 project"
  engine_integration: "The AI agent is built into Summer's own Godot-compatible engine"
  local_models: "Local models via Ollama through an external agent app; built-in AI is hosted"
  hosting: "Publishes web builds to Summer Games, but every release needs owner approval and staff review"
  pixel_art: "Pixel Art and Retro 16-bit style presets, plus a Pixel sprite tool that works from one image"
  sprite_sheets: "Sprite sheet tool on the Effects tab builds a sheet from one uploaded image"
  transparent_bg: "Background removal after generation, not a transparent output option"
  multi_direction: "Turnaround sheets from one image; set 4- or 8-direction sprite views aren't advertised"
  api: "Asset generation through the Summer MCP server for AI agents; no API key or REST API"
plans:
- name: Hobby
  price_usd: 0
  period: free
  includes: Limited agent use and AI assets, 100 MCP calls/wk, 1 GiB storage
- name: Pro
  price_usd: 20
  period: month
  includes: Extended agent usage, higher AI asset limits, 20 GiB storage
- name: Pro+
  price_usd: 60
  period: month
  includes: 3x Pro AI usage, 100 GiB storage
- name: Ultra
  price_usd: 200
  period: month
  includes: 10x Pro AI usage, priority access, 500 GiB storage
