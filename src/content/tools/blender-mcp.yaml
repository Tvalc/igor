name: "MCP for Blender"
url: "https://www.mcp-for-blender.com"
tagline: "Open-source MCP addon that lets Claude and any other LLM control Blender."
description: "MCP for Blender (formerly BlenderMCP; the PyPI package is now mcp-for-blender) is an open-source, MIT-licensed Blender addon and MCP server that lets AI assistants create and edit Blender scenes. Optional Premium plans from $10 a month add built-in AI 3D generation (Hunyuan3D, Tripo, Hyper3D Rodin) without your own API keys."
best_for: Prompting Blender to build or modify 3D scenes.
