pricing:
  model: freemium
  free_tier: 'yes'
  starting_price_usd: 10
  notes: "Addon is free and open source (bring your own Hunyuan3D or Rodin keys); Premium: Hobby $10/mo (25 standard generations), Pro $20, Studio $60, Max $100; Enterprise custom; 2 months free yearly"
