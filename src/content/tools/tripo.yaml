  includes: 3,000 credits/mo (~200 models); $11.94/mo yearly
- name: Max
  price_usd: 90
  period: month
  includes: 25,000 credits/mo; billed annually $1,080
- name: Team
  price_usd: 165
  period: month
  includes: 3 seats, 90,000 credits/mo; $1,980/yr
