name: Tripo
url: https://www.tripo3d.ai
tagline: Text or image to 3D with auto-rigging.
description: Tripo generates 3D models from text or images and can auto-rig them. Its H3.1 model is the current
  version.
best_for: 3D characters and props that need rigging.
categories:
